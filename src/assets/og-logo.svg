<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 768" width="100%" height="100%">
  <defs>
    <filter id="glow-main" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Constellation Network Graph Mark -->
  <g transform="translate(100, 40)">
    <!-- Edge Lines -->
    <g stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="280" y1="240" x2="230" y2="360" stroke="#FFB800" opacity="0.75"/>
      <line x1="280" y1="240" x2="330" y2="360" stroke="#FFB800" opacity="0.65"/>
      <line x1="280" y1="240" x2="410" y2="260" stroke="#00E676" opacity="0.65"/>
      
      <line x1="230" y1="360" x2="280" y2="480" stroke="#00E676" opacity="0.75"/>
      <line x1="230" y1="360" x2="330" y2="360" stroke="#FFA000" opacity="0.65"/>

      <line x1="280" y1="480" x2="330" y2="360" stroke="#00E676" opacity="0.75"/>
      <line x1="280" y1="480" x2="390" y2="390" stroke="#00B0FF" opacity="0.65"/>

      <line x1="330" y1="360" x2="410" y2="260" stroke="#00E676" opacity="0.75"/>
      <line x1="330" y1="360" x2="390" y2="390" stroke="#00C853" opacity="0.75"/>
      <line x1="330" y1="360" x2="460" y2="360" stroke="#2979FF" opacity="0.55"/>

      <line x1="410" y1="260" x2="390" y2="390" stroke="#00E676" opacity="0.65"/>
      <line x1="410" y1="260" x2="460" y2="360" stroke="#2979FF" opacity="0.75"/>

      <line x1="390" y1="390" x2="460" y2="360" stroke="#2979FF" opacity="0.85"/>
    </g>

    <!-- Glowing Nodes -->
    <circle cx="280" cy="240" r="22" fill="#FFB800" filter="url(#glow-main)"/>
    <circle cx="280" cy="240" r="14" fill="#FFD54F"/>

    <circle cx="230" cy="360" r="20" fill="#FFA000" filter="url(#glow-main)"/>
    <circle cx="230" cy="360" r="12" fill="#FFC107"/>

    <circle cx="280" cy="480" r="22" fill="#00E676" filter="url(#glow-main)"/>
    <circle cx="280" cy="480" r="14" fill="#B9F6CA"/>

    <circle cx="330" cy="360" r="18" fill="#00C853"/>
    <circle cx="330" cy="360" r="10" fill="#69F0AE"/>

    <circle cx="410" cy="260" r="20" fill="#00E676" filter="url(#glow-main)"/>
    <circle cx="410" cy="260" r="12" fill="#B9F6CA"/>

    <circle cx="390" cy="390" r="18" fill="#00B0FF" filter="url(#glow-main)"/>
    <circle cx="390" cy="390" r="10" fill="#80D8FF"/>

    <circle cx="460" cy="360" r="24" fill="#2979FF" filter="url(#glow-main)"/>
    <circle cx="460" cy="360" r="15" fill="#82B1FF"/>
  </g>

  <!-- Typography -->
  <g fill="currentColor">
    <text x="620" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="205" letter-spacing="-2">
      <tspan fill="#FFB800">Org</tspan><tspan fill="currentColor" font-weight="600">Explorer</tspan>
    </text>
  </g>
</svg>
