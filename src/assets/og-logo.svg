<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 768" width="100%" height="100%">
  <defs>
    <!-- Brand Accent Gradients -->
    <linearGradient id="org-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCCC02" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <linearGradient id="node-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#008340" />
    </linearGradient>
    <linearGradient id="node-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Left Icon - Org Nodes Mesh) -->
  <g transform="translate(120, 134)">
    <path d="M 250 250 L 140 130" stroke="#FCCC02" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 250 250 L 360 130" stroke="#00C853" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 250 250 L 140 370" stroke="#3B82F6" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 250 250 L 360 370" stroke="#FCCC02" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 140 130 L 360 130" stroke="currentColor" stroke-width="8" stroke-dasharray="16 12" opacity="0.35"/>
    <path d="M 140 370 L 360 370" stroke="currentColor" stroke-width="8" stroke-dasharray="16 12" opacity="0.35"/>
    <path d="M 140 130 L 140 370" stroke="currentColor" stroke-width="8" opacity="0.25"/>
    <path d="M 360 130 L 360 370" stroke="currentColor" stroke-width="8" opacity="0.25"/>

    <!-- Outer Nodes -->
    <circle cx="250" cy="70" r="28" fill="url(#org-accent-grad)" />
    <circle cx="410" cy="160" r="24" fill="url(#node-green-grad)" />
    <circle cx="410" cy="340" r="24" fill="url(#node-blue-grad)" />
    <circle cx="250" cy="430" r="28" fill="url(#org-accent-grad)" />
    <circle cx="90" cy="340" r="24" fill="url(#node-green-grad)" />
    <circle cx="90" cy="160" r="24" fill="url(#node-blue-grad)" />

    <!-- Center Root Node -->
    <circle cx="250" cy="250" r="54" fill="url(#org-accent-grad)" filter="url(#glow)"/>
    <circle cx="250" cy="250" r="24" fill="#121316"/>
    <circle cx="250" cy="250" r="12" fill="#FCCC02"/>
  </g>

  <!-- Typography / Text: OrgExplorer -->
  <g fill="currentColor">
    <text x="640" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="210" letter-spacing="-2">
      <tspan fill="url(#org-accent-grad)">Org</tspan><tspan fill="currentColor" font-weight="400">Explorer</tspan>
    </text>
    <text x="648" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="44" letter-spacing="8" fill="currentColor" opacity="0.6">
      OPEN SOURCE ANALYTICS &amp; INSIGHTS
    </text>
  </g>
</svg>

